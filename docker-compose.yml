services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: jansetu
      POSTGRES_USER: jansetu
      POSTGRES_PASSWORD: local-development-only
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jansetu -d jansetu"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://jansetu:local-development-only@db:5432/jansetu
      SECRET_KEY: ${SECRET_KEY:-local-demo-replace-before-deploy}
      CORS_ORIGINS: http://localhost:3000
      UPLOAD_DIR: /data/private_uploads
    volumes: ["uploads:/data"]
    depends_on:
      db: {condition: service_healthy}
    ports: ["8000:8000"]
  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on: [api]
    ports: ["3000:3000"]
  chain:
    image: node:20-alpine
    working_dir: /chain
    volumes: ["./blockchain:/chain"]
    command: sh -c "npm install && npx hardhat node --hostname 0.0.0.0"
    ports: ["8545:8545"]
volumes:
  uploads:
